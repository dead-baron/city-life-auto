<!doctype html><html><head><meta charset="utf-8"><title>Art v2 vehicles</title>
<style>body{margin:0;background:#4a4e58}canvas{image-rendering:pixelated;display:block}</style></head><body><canvas id="c"></canvas>
<!-- ?view=line (every vehicle, side-ish 3/4), ?view=rot (sedan at 16 headings), ?view=state (damage + lights) -->
<script type="module">
import { vehicleModel } from '../../client/art2/vehicles.js';
import { GBuf } from '../../client/art2/gbuf.js';
import { Lighter, PRESETS } from '../../client/art2/light.js';
const q = new URLSearchParams(location.search), view = q.get('view') || 'line', Z = Number(q.get('z') || 2);
let items = [];   // [model, heading, x, y]
let W = 1200, H = 700;
if (view === 'line') {
  const rows = [['compact', 'sedan', 'taxi', 'sports', 'pickup', 'van'], ['police', 'ambulance', 'armored', 'swat', 'bike', 'policebike', 'bicycle'],
    ['bus', 'flatbed', 'boxtruck'], ['dumptruck', 'mixer', 'tanker'], ['garbage', 'firetruck', 'towtruck'], ['jetski', 'speedboat', 'dinghy', 'policeboat']];
  H = rows.length * 110 + 40; W = 1000;
  rows.forEach((r, ri) => { let x = 20; r.forEach((t) => { const m = vehicleModel(t, { cargo: t === 'pickup' ? [1, 3] : t === 'flatbed' ? [1, 2, 3, 4, 1, 2] : t === 'speedboat' ? [2, 4] : [] }); items.push([m, 0, x + m.w / 2, 80 + ri * 110]); x += m.w + 24; }); });
} else if (view === 'moto') {
  // the MC1 motorcycles (task #366): each from the side and three-quarters, like the concept sheet
  const bikes = ['vtwin', 'tourer', 'chopper', 'bobber', 'caferacer', 'bike', 'dirtbike', 'scooter', 'trike', 'policebike', 'ratbike', 'bagger'];
  W = 4 * 170; H = 3 * 150;
  bikes.forEach((t, i) => { const m = vehicleModel(t, { variant: 3, lights: 1 }); const x = 50 + (i % 4) * 170, y = 60 + Math.floor(i / 4) * 150; items.push([m, Math.PI, x + 40, y]); items.push([vehicleModel(t, { variant: 3 }), Math.PI * 0.8, x + 60, y + 62]); });
} else if (view === 'rot') {
  W = 4 * 140; H = 4 * 120;
  for (let i = 0; i < 16; i++) items.push([vehicleModel('sedan', { paint: '#3a7a84' }), -i / 16 * Math.PI * 2, 70 + (i % 4) * 140, 70 + Math.floor(i / 4) * 120]);
} else {
  W = 3 * 150; H = 3 * 120;
  const s = [['clean'], ['dented'], ['wrecked'], ['burnt'], ['clean', 0], ['clean', 0], ['clean', 1], ['clean', 1], ['police', 1]];
  s.forEach(([st, li], i) => items.push([st === 'police' ? vehicleModel('police', { lights: 1, siren: true }) : vehicleModel('sedan', { paint: '#3a7a84', state: st, lights: li }), 0, 75 + (i % 3) * 150, 70 + Math.floor(i / 3) * 120]));
}
const G = new GBuf(W, H);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const v = 96 + ((x * 7 + y * 13) % 5) * 2; G.put(x, y, view === 'line' && y > H - 130 ? [30, 90, 130] : [v, v + 2, v + 8], [0, 0, 1], 0, null, 1); }
items.sort((a, b) => a[3] - b[3]);
for (const [m, hd, x, y] of items) { const s = m.render(hd); G.blit(s, x - s.ax, y - s.ay); }
const cv = document.getElementById('c'); cv.width = W * Z; cv.height = H * Z;
const L = new Lighter(cv); L.setScene(G);
L.render(view === 'state' ? PRESETS.golden : PRESETS.golden, [], 0);
window.done = true;
</script></body></html>
