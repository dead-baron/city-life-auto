<!doctype html>
<html><head><meta charset="utf-8"><title>Chunk stand-ins</title>
<style>body{margin:0;background:#222;color:#ddd;font:12px sans-serif}canvas{image-rendering:pixelated;display:block}#info{position:fixed;top:4px;left:6px;background:#000a;padding:2px 6px}</style></head>
<body><div id="info">loading...</div><canvas id="c"></canvas>
<script type="module">
// The stand-ins the live renderer shows while a chunk's bake is on the way (client/art2/game/standin.js), for a
// block of chunks: ?c=35,22&w=3&h=2&s=2 (top-left chunk, chunks across and down, scale)
import { generateCity } from '../../shared/map.js';
import { drawStandIn, STANDIN_PX } from '../../client/art2/game/standin.js';
const q = new URLSearchParams(location.search);
const [c0x, c0y] = (q.get('c') || '35,22').split(',').map(Number), W = +(q.get('w') || 3), H = +(q.get('h') || 2), S = +(q.get('s') || 2);
const M = generateCity(+(q.get('seed') || 1337));
const cv = document.getElementById('c'), n = STANDIN_PX;
cv.width = W * n; cv.height = H * n; cv.style.width = `${W * n * S}px`; cv.style.height = `${H * n * S}px`;
const g = cv.getContext('2d');
const tile = document.createElement('canvas'); tile.width = tile.height = n;
const tg = tile.getContext('2d');
const times = [];
for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
  const t = performance.now();
  tg.clearRect(0, 0, n, n);
  drawStandIn(tg, M, c0x + i, c0y + j);
  times.push(performance.now() - t);
  g.drawImage(tile, i * n, j * n);
}
document.getElementById('info').textContent = `stand-ins ${c0x},${c0y} ${W}x${H}: ${times.map((t) => t.toFixed(1)).join(' ')} ms (first builds the index)`;
window.done = true;
</script></body></html>
