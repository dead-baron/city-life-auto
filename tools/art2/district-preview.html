<!doctype html><html><head><meta charset="utf-8"><title>Art v2 districts</title>
<style>body{margin:0;background:#18181c;color:#ccc;font:13px monospace}canvas,img{image-rendering:pixelated;display:block}
.wrap{position:relative;width:1536px;height:1024px}.wrap canvas{position:absolute;left:0;top:0}h3{margin:8px}a{color:#9cf;margin-right:10px}</style></head><body>
<!-- One district block built by client/art2/districts.js, lit for ?p=golden|noon|night|rain, with its D target
     underneath (?target=0 to hide it). ?d=suburbs|southside|luxury|downtown|transit|ferry|industrial|beach|park|farm|desert|forest|civic|oldtown|apartments|nightlife|commercial|islands|blend. Serve the repo root. -->
<h3 id="t"></h3>
<div class="wrap"><canvas id="c" width="1536" height="1024"></canvas><canvas id="rain" width="1536" height="1024"></canvas></div>
<div id="nav"></div>
<img id="tg">
<script type="module">
import { CITY_DISTRICTS as DISTRICTS, CITY_TARGETS as DISTRICT_TARGETS } from '../../client/art2/districts4.js';
import { Lighter, PRESETS } from '../../client/art2/light.js';
const q = new URLSearchParams(location.search), d = q.get('d') || 'suburbs', preset = q.get('p') || 'golden';
document.getElementById('nav').innerHTML = Object.keys(DISTRICTS).map((k) => ['golden', 'noon', 'night', 'rain'].map((p) => `<a href="?d=${k}&p=${p}">${k} ${p}</a>`).join('')).join('<br>');
const T0 = performance.now();
const { G, lights } = DISTRICTS[d](preset);
const T1 = performance.now();
const cv = document.getElementById('c'), rc = document.getElementById('rain'), wrap = document.querySelector('.wrap');
for (const c of [cv, rc]) { c.width = G.w * 2; c.height = G.h * 2; }
wrap.style.width = G.w * 2 + 'px'; wrap.style.height = G.h * 2 + 'px';
const L = new Lighter(cv);
L.setScene(G);
L.render(PRESETS[preset], lights, 1.0);
document.getElementById('t').textContent = `${d} - ${preset} - ${G.w} x ${G.h} world px - built in ${(T1 - T0).toFixed(0)} ms, ${lights.length} lights`;
if (PRESETS[preset].rain) {
  const g = document.getElementById('rain').getContext('2d');
  let s = 7; const r = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < 520 * (G.w * G.h) / (768 * 512); i++) { const x = r() * G.w * 2, y = r() * G.h * 2, l = 10 + r() * 14; g.strokeStyle = `rgba(190,205,255,${0.18 + r() * 0.22})`; g.lineWidth = 2; g.beginPath(); g.moveTo(x, y); g.lineTo(x - l * 0.25, y + l); g.stroke(); }
}
const tg = document.getElementById('tg');
if (q.get('target') !== '0') { tg.onload = () => { window.done = true; }; tg.src = '../../docs/art-v2/targets/' + DISTRICT_TARGETS[d]; tg.style.width = '1536px'; }
else window.done = true;
window.info = (T1 - T0).toFixed(0) + ' ms';
</script></body></html>
