<!doctype html><html><head><meta charset="utf-8"><title>Live world test</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#hud{position:absolute;left:6px;bottom:4px;font:11px/1.35 monospace;color:#e4f0ea;text-shadow:0 1px 2px #000;white-space:pre;pointer-events:none}</style></head><body>
<!-- The live world through the art v2 engine at a fixed camera and a controlled clock, without the game: the real
     map (shared/map.js generateCity), the chunks round the camera baked here (chunkbake.js), the wind, the water,
     the rain - for checking the moving parts frame by frame. Serve the repo root.
       ?cam=x,y      world px of the view centre            &p=noon|golden|dusk|night|rain|storm|...  (preset)
       &t=seconds    the clock (waves, surf, rain)          &wind=strength,dirx,diry,gust  (default 0.1,1,0,0.3)
       &windt=s      the wind clock (default t)             &rain=0..1   &wet=0..1   &q=0..3 quality  &z=zoom
       &r=1          chunks baked round the camera's chunk (r=1: 3 x 3)
       &fade=0.88    fades every building in view that far (the see-through you get walking behind one)
       &artpx=1      the art at full resolution (default 2: 1 art pixel = 2 world px, as in the game)
       &lights=1     the baked static lights (lamps, windows, signs) added at that strength, as the game does at night
       &cabs=T       the Ferris wheel's gondolas where they are at loop time T (shared/rides.js; the wheel bakes without)
       &balloon=r,t,pal  a balloon flight on route r (balloonRoutes) t seconds after lift-off, in palette pal
     window.render(t, windT) draws another frame at that clock (returns when done); window.ready once baked. -->
<canvas id="cv"></canvas><div id="hud"></div>
<script type="module">
import { Art2Engine, PRESETS_GAME } from '../../client/art2/game/engine.js';
import { bakeChunk, loadProviders, SpriteCache, CHUNK } from '../../client/art2/game/chunkbake.js';
import { generateCity } from '../../shared/map.js';
import { FERRIS, ferrisSite, ferrisCab, balloonRoutes, balloonAt } from '../../shared/rides.js';
import * as Act from '../../client/art2/game/actors.js';
const q = new URLSearchParams(location.search);
const [camX, camY] = (q.get('cam') || '18300,12780').split(',').map(Number);
const Q = +(q.get('q') ?? 2), R = +(q.get('r') ?? 1), PN = q.get('p') || 'noon';
const [ws, wdx, wdy, wg] = (q.get('wind') || '0.1,1,0,0.3').split(',').map(Number);
const rain = +(q.get('rain') || 0), wet = +(q.get('wet') || rain);
const cv = document.getElementById('cv'), hud = document.getElementById('hud');
const W = innerWidth, H = innerHeight, dpr = 1;
const eng = Art2Engine.create(cv, { quality: Q, artPx: +(q.get('artpx') || 2) });
window.eng = eng;
eng.resize(W, H, dpr);
const long = Math.max(W, H), vh = 660 * (1 + 0.3 * Math.min(1, Math.max(0, (long - 960) / 960)));
const zoom = +(q.get('z') || long / (vh * 16 / 9));
const t0 = performance.now();
await loadProviders();
const M = generateCity(1337);
const cache = new SpriteCache(200e6);
const ccx = Math.floor(camX / CHUNK), ccy = Math.floor(camY / CHUNK);
const fades = new Map(), fadeK = +(q.get('fade') || 0);
const lightK = +(q.get('lights') || 0), lights = [];   // &lights=1: the chunks' static lights at night strength (the game's host adds them every frame)
for (let cy = ccy - R; cy <= ccy + R; cy++) for (let cx = ccx - R; cx <= ccx + R; cx++) {
  const r = bakeChunk(M, cx, cy, { quality: Q, seed: 1337, artPx: eng.ap }, cache);
  const g = r.g; g.under = r.under; g.blds = r.blds;
  if (lightK) for (const L of r.lights || []) if (L.kind !== 'fire') lights.push(L);
  eng.uploadChunk(cx, cy, g);
  if (fadeK) for (const b of r.blds || []) fades.set(b[0], fadeK);
}
// the rides' sprites (the game's host draws them every frame: art2/game/host.js _rides)
Act.setArtPx(eng.ap);
const sprites = [];
const sprite = (key, make) => { if (!eng.hasSprite(key)) eng.uploadSprite(key, make()); return key; };
if (q.get('cabs') !== null) {
  const wheel = ferrisSite(M), T = +q.get('cabs');
  for (let k = 0; wheel && k < FERRIS.n; k++) { const col = k % FERRIS.cols, c = ferrisCab(wheel, k, T); sprites.push([sprite(Act.rideKey('cab', col), () => Act.rideSprite('cab', col)), c.x, c.y, c.z, false]); }
}
if (q.get('balloon')) {
  const [r, t, pal] = q.get('balloon').split(',').map(Number), route = balloonRoutes(M)[r || 0];
  if (route) { const at = balloonAt(route, t, 100); sprites.push([sprite(Act.rideKey('balloon', pal || 0), () => Act.rideSprite('balloon', pal || 0)), at.x, at.y, at.z, at.z > 24]); if (lightK) lights.push({ x: at.x, y: at.y, z: at.z + 46, r: 150, col: [1, 0.55, 0.2], k: 1.6 }); }
}
const P = { ...(PRESETS_GAME[PN] || PRESETS_GAME.noon) };
const wind = [ws, wg, wdx, wdy];
window.render = (t, windT = t) => {
  eng.beginFrame({ camX, camY, zoom, viewW: W / zoom, viewH: H / zoom, time: t, preset: P, wet, quality: Q, wind, windT, fades });
  for (const [key, x, y, z, air] of sprites) eng.drawSprite(key, x, y, z, { alpha: 1, shadow: true, air, flash: 0, xray: false, flipX: false, tint: null });
  for (const L of lights) eng.addLight({ x: L.x, y: L.y, z: L.z || 0, r: L.r, col: L.col, k: L.k * lightK });
  eng.endFrame();
  eng.gl.readPixels(0, 0, 1, 1, eng.gl.RGBA, eng.gl.UNSIGNED_BYTE, new Uint8Array(4));
  hud.textContent = `cam ${camX},${camY} t ${t.toFixed(2)} wind ${ws} rain ${rain} q${Q} ${PN}  baked in ${((performance.now() - t0) / 1000).toFixed(1)} s`;
  return true;
};
P.rain = rain;
window.render(+(q.get('t') || 0), q.get('windt') ? +q.get('windt') : undefined);
window.ready = true; window.done = true;
</script></body></html>
